# Docker domain pack: the knowledge graph the agent reads alongside retrieval. Human-curated, reviewed in git.
#
# provenance:  kb      = taken from the Docker documentation in our KB (headings, product pages)
#              tickets = alias wording seen in the 13k historical tickets
#              general = author's general Docker knowledge; REVIEW before relying on it (no KB passage backs it here)
# Issues with `kb: []` are known community problems the KB does not document: the agent can say so instead of guessing.
# `summary` is background for the model, never evidence. Add a node by copying one; run `python -m triage.ontology check`.
domain: docker
version: "0.1"

entities:
  # ============================================================ the platform and its core objects
  - id: docker
    type: concept
    name: Docker
    generic: true
    aliases: [docker, docker platform]
    summary: "A platform for building, shipping and running applications in containers."
    provenance: kb
  - id: container
    type: concept
    name: container
    generic: true
    aliases: [container, containers]
    summary: "A running, isolated instance of an image."
    provenance: kb
  - id: image
    type: concept
    name: image
    generic: true
    aliases: [image, images, docker image, docker images]
    summary: "A read-only template (layers plus metadata) a container is started from."
    provenance: kb
  - id: dockerfile
    type: concept
    name: Dockerfile
    generic: true
    aliases: [dockerfile, docker file]
    summary: "The text file of instructions that describes how to build an image."
    provenance: kb

  # ============================================================ products and components
  - id: docker-desktop
    type: product
    name: Docker Desktop
    kb_area: desktop
    aliases: [docker desktop, docker desktop app]
